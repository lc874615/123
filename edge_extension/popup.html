<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>Ozon 商品助手</title>
<style>
*{box-sizing:border-box}body{width:380px;margin:0;background:#f4f7fb;color:#203047;font:13px/1.55 "Segoe UI","Microsoft YaHei",sans-serif}header{padding:17px 18px 12px;background:white;border-bottom:1px solid #e1e7ef}header h1{font-size:17px;margin:0 0 5px}small{color:#6d7e94}main{padding:14px 16px}section,details{background:white;border:1px solid #dfe7f0;border-radius:10px;padding:12px;margin-bottom:12px}.badge{display:inline-block;border-radius:20px;padding:2px 9px;background:#edf2f8;color:#4f6380;font-size:12px}.badge.ok{background:#e7f7ef;color:#16754a}.badge.error{background:#fff0ed;color:#a83c28}.current{display:flex;justify-content:space-between;margin:9px 0;color:#62738a}.current strong{color:#213b5c}button,input,textarea,select{font:inherit;width:100%;border-radius:7px}button{border:1px solid #ccd8e6;background:#f8fafc;padding:9px;cursor:pointer;margin-top:7px;color:#29425e}button:hover{background:#edf3fb}button:disabled{opacity:.5;cursor:default}.primary{background:#2167b7;color:white;border-color:#2167b7}.primary:hover{background:#18518f}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button{margin:0}input,textarea,select{border:1px solid #cbd7e6;padding:8px;margin-top:6px}summary{cursor:pointer;font-weight:600}label{display:block;margin-top:8px;color:#596b82}#status{white-space:pre-wrap;word-break:break-word;margin:9px 0 0}#binding{white-space:pre-wrap;word-break:break-word;color:#687c96;font-size:12px;margin:8px 0}.subtle{font-size:12px;color:#75869b}.group{border-top:1px solid #e8edf4;margin-top:12px;padding-top:6px}pre{white-space:pre-wrap;max-height:210px;overflow:auto;font-size:12px}
</style></head><body>
<header><h1>Ozon 商品助手 <small>1.0.18</small></h1><span class="badge" id="connection-state">检查连接…</span></header>
<main><section aria-label="当前任务"><div class="current"><span>当前货号</span><strong id="current-sku">暂无任务</strong></div><div class="actions"><button class="primary" id="run">开始 / 继续</button><button id="stop">暂停制作</button></div><button id="focus-work">定位 / 更换作图页</button><section id="binding-picker" hidden><p class="subtle">暂停时可重新选择已打开的商品对话；保存后保持暂停。</p><select id="binding-tabs" aria-label="选择商品作图页"></select><button id="binding-refresh">刷新页面列表</button><button class="primary" id="binding-save">绑定所选页（保持暂停）</button><button id="binding-cancel">取消</button></section><p id="binding">读取绑定页面…</p><p id="status" role="status" aria-live="polite">正在读取状态…</p></section>
<details id="connection-settings"><summary>连接设置</summary><p class="subtle">首次在商品作图页保存配对并绑定当前页；以后本地创建任务自动启动，本机重启后保留绑定。</p><label>本地配对码<input id="token" type="password" autocomplete="off"></label><button id="pair">保存配对并绑定当前作图页</button></details>
<details id="advanced"><summary>高级恢复</summary><p class="subtle">先暂停当前任务；按最终编号文件重新采集，完成后继续文案，不重新作图。</p><label>需要恢复的货号<input id="sku" placeholder="例如 BASE(1)"></label><button id="recover">采集已有图片并继续</button><button id="copy">自动采集/补全文案并同步全组</button>
<section id="copy-choice" hidden><p>文案未带货号，请核对后关联保存：</p><select id="copy-choice-list"></select><pre id="copy-choice-preview"></pre><button id="copy-choice-save">关联此文案并保存</button></section>
<details class="group"><summary>手动粘贴文案（备用）</summary><label>粘贴现有 JSON<textarea id="copy-json" rows="6"></textarea></label><button id="copy-paste">校验并保存</button></details><div class="group"><button id="diagnose">导出页面诊断</button></div></details>
<p class="subtle">素材在本地工具处理，预览后由你点击提交上架。</p></main>
<script src="copy_parser.js"></script><script src="popup.js"></script></body></html>
