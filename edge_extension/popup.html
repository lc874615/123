<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Ozon 本地助手</title><style>body{width:330px;font:14px system-ui;padding:12px}input,button{box-sizing:border-box;width:100%;padding:9px;margin:5px 0}#status{white-space:pre-wrap;line-height:1.5}</style><h3>Ozon 本地作图助手</h3><label>本地服务配对码<input id="token" type="password" autocomplete="off"></label><button id="pair">保存配对码</button><button id="run">绑定此标签并开启自动批次</button><button id="stop">停止自动批次</button><input id="sku" placeholder="恢复保存的商品SKU"><button id="recover">保存本页现有8张图（不重新生成）</button><button id="copy">为此SKU生成俄文文案并保存</button><button id="copy-recover">保存本页现有文案（不重新生成）</button><details><summary>备用：粘贴网页现有JSON</summary><textarea id="copy-json" rows="8" style="width:100%;box-sizing:border-box" placeholder="复制ChatGPT回复中的完整JSON到这里"></textarea><button id="copy-paste">校验并保存粘贴的文案</button></details><p id="status">先启动本地工具，再打开已登录的 ChatGPT 商品对话并上传原图。</p><script src="copy_parser.js"></script><script src="popup.js"></script></html>
